version: "3.3"
services:
  d0p1:
    container_name: "d0p1"
    image: "plexinc/pms-docker"
    volumes:
        - /plex1/config:/config
        - type: volume
          source: Movies
          target: /mnt/Movies
          volume:
             nocopy: true
        - type: volume
          source: TV-Shows
          target: /mnt/TV-Shows
          volume:
             nocopy: true
        - type: volume
          source: TV-Shows1
          target: /mnt/TV-Shows1
          volume:
             nocopy: true
        - type: volume
          source: sabnzb
          target: /mnt/sabnzb
          volume:
             nocopy: true
    environment:
        - PUID=568
        - PGID=100
        - PLEX_CLAIM=claim-rm44BamVy3NYF3DmgvEE
    ports:
      - 32400:32400
    restart: always

  sabnzbd:
    container_name: "sabnzbd"
    image: "linuxserver/sabnzbd"
    volumes:
      - /sabnzb/config:/config
      - type: volume
        source: sabnzb
        target: /mnt/sabnzb
      - type: volume
        source: Movies
        target: /mnt/Movies
    environment:
      - PUID=0
      - PGID=0
    restart: always
    ports:
      - 8080:8080

  sonarr:
    container_name: "sonarr"
    image: "linuxserver/sonarr"
    ports:
      - 8989:8989
    volumes:
      - /sonarr/config:/config
      - type: volume
        source: TV-Shows
        target: /mnt/TV-Shows
      - type: volume
        source: TV-Shows1
        target: /mnt/TV-Shows1
      - type: volume
        source: sabnzb
        target: /mnt/sabnzb
    environment:
      - PUID=0
      - PGID=0
    restart: always

  radarr:
    container_name: "radarr"
    image: "linuxserver/radarr"
    ports:
      - 7878:7878
    volumes:
      - /radarr/config:/config
      - type: volume
        source: Movies
        target: /mnt/Movies
      - type: volume
        source: sabnzb
        target: /mnt/sabnzb
    environment:
      - PUID=568
      - PGID=100
    restart: always

  readarr:
    container_name: "readarr"
    image: "lscr.io/linuxserver/readarr:develop"
    networks:
      L2Net:
        ipv4_address: 10.0.0.16
    volumes:
      - /readarr/config:/config
      - type: volume
        source: Movies
        target: /mnt/Movies
      - type: volume
        source: sabnzb
        target: /mnt/sabnzb
    environment:
      - PUID=568
      - PGID=100
    restart: always

  smokeping:
    container_name: smokeping
    image: lscr.io/linuxserver/smokeping
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /smokeping-config:/config
      - /smokeping-data:/data
    restart: always
    ports:
      - 8081:80

  transmission:
    container_name: "transmission"
    image: "linuxserver/transmission"
    networks:
      L2Net:
        ipv4_address: 10.0.0.17
    volumes:
      - /transmission/config:/config
      - type: volume
        source: Movies
        target: /mnt/Movies
      - type: volume
        source: transmission
        target: /downloads
    environment:
      - PUID=0
      - PGID=0
    restart: always

  homebridge:
     container_name: "homebridge"
     image: homebridge/homebridge:latest
     networks:
       L2Net:
          ipv4_address: 10.0.0.141
     volumes:
       - /homebridge:/homebridge
     logging:
       driver: json-file
       options:
         max-size: "10mb"
         max-file: "1"
     environment:
        - PUID=0
        - PGID=0
     restart: always

  overseerr:
     container_name: "overseerr"
     image: sctx/overseerr:latest
     ports:
      - 5055:5055
     volumes:
      - /overseerr/config:/app/config
     logging:
       driver: json-file
       options:
         max-size: "10mb"
         max-file: "1"
     environment:
      - PUID=0
      - PGID=0
     restart: always

  gozznet:
    container_name: gozznet
    image: mgossman71/gozznet-old
    ports:
      - 80:80
    restart: always

volumes:
  Movies:
    driver_opts:
      type: "nfs"
      o: "addr=10.0.0.241,nolock,soft,rw"
      device: ":/volume1/Movies"

  TV-Shows:
    driver_opts:
      type: "nfs"
      o: "addr=10.0.0.241,nolock,soft,rw"
      device: ":/volume1/TV-Shows"

  TV-Shows1:
    driver_opts:
      type: "nfs"
      o: "addr=10.0.0.241,nolock,soft,rw"
      device: ":/volume1/TV-Shows1"

  sabnzb:
    driver_opts:
      type: "nfs"
      o: "addr=10.0.0.241,nolock,soft,rw"
      device: ":/volume1/sabnzb"

  transmission:
    driver_opts:
      type: "nfs"
      o: "addr=10.0.0.241,nolock,soft,rw"
      device: ":/volume1/sabnzb/transmission"

networks:
    L2Net:
       driver: ipvlan
       driver_opts:
          parent: eth1
          ipvlan_mode: l2
       ipam:
         config:
            - subnet: 10.0.0.0/16